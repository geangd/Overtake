<style>
:root{--bg:#F2F2F7;--card:#FFFFFF;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.22);--sep:rgba(60,60,67,.18);--l1:#000;--l2:rgba(60,60,67,.62);--l3:rgba(60,60,67,.3);--tint:#E10600;--green:#248A3D;--yellow:#FFCC00;--orange:#C93400;--blue:#007AFF;--purple:#8944AB;--red:#D70015;--mat:rgba(248,248,250,.82);--segon:#FFFFFF;--asph:#D5D8DE;--hl:rgba(225,6,0,.07);--line:var(--l3);--text:var(--l1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1C1C1E;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.38);--sep:rgba(84,84,88,.6);--l1:#FFF;--l2:rgba(235,235,245,.6);--l3:rgba(235,235,245,.3);--tint:#FF453A;--green:#30D158;--yellow:#FFD60A;--orange:#FF9F0A;--blue:#0A84FF;--purple:#BF5AF2;--red:#FF453A;--mat:rgba(28,28,30,.8);--segon:#636366;--asph:#3A3A3C;--hl:rgba(255,69,58,.13)}}
:root[data-theme="dark"]{--bg:#000;--card:#1C1C1E;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.38);--sep:rgba(84,84,88,.6);--l1:#FFF;--l2:rgba(235,235,245,.6);--l3:rgba(235,235,245,.3);--tint:#FF453A;--green:#30D158;--yellow:#FFD60A;--orange:#FF9F0A;--blue:#0A84FF;--purple:#BF5AF2;--red:#FF453A;--mat:rgba(28,28,30,.8);--segon:#636366;--asph:#3A3A3C;--hl:rgba(255,69,58,.13)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--l1);font:17px/1.35 -apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.hide{display:none!important}
.bad{color:var(--red)}.good{color:var(--green)}.tint{color:var(--tint)}.small{font-size:15px}
.ic{flex:none;display:block}
.pg{max-width:600px;margin:0 auto;padding:0 0 110px}
.nb{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}

.nbl{justify-self:start}.nbr{justify-self:end;display:flex;align-items:center;gap:8px}
.nbb{background:none;border:0;color:var(--tint);display:flex;align-items:center;gap:1px;font-size:17px;padding:6px 2px}
.icb{width:34px;height:34px;border-radius:50%;border:0;background:var(--fill);color:var(--l1);display:grid;place-items:center;padding:0;flex:none}
.icb.txt{font-size:13px;font-weight:600;width:42px;border-radius:17px;font-variant-numeric:tabular-nums}
.cashp{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}

.lt{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:16px 20px 2px;line-height:1.1}
.sub{margin:0 20px 14px;color:var(--l2);font-size:15px}

.grp{background:var(--card);border-radius:12px;margin:0 16px;overflow:hidden}
.grp+.grp{margin-top:18px}
.cell{display:flex;align-items:center;gap:12px;min-height:46px;padding:9px 16px;position:relative;width:100%;background:none;border:0;text-align:left;color:inherit}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
button.cell:active{background:var(--fill)}
.cell .t{flex:1;min-width:0;display:flex;flex-direction:column}
.cell .t small{font-size:13px;color:var(--l2);margin-top:2px;line-height:1.3}

.cell>.ic{color:var(--l3)}
.cell.mine{background:var(--hl)}
.cell.ctr{justify-content:center}
.ovr{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mapc{padding:10px}
.thumb,#map{width:100%;height:auto;display:block}
.btn{display:block;width:calc(100% - 32px);margin:20px 16px 0;height:50px;border:0;border-radius:12px;background:var(--tint);color:#fff;font-size:17px;font-weight:600}
.btn.plain{background:none;color:var(--tint);margin-top:4px}

.acts{gap:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;flex:none}

.seg button.on{background:var(--segon);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.05);font-weight:600}
.cell .seg{min-width:168px}
.tf{display:inline-flex;border-radius:3px;overflow:hidden;box-shadow:0 0 0 .5px var(--l3);flex:none}
.tf i{flex:1}
.mtr{flex:1;height:5px;border-radius:3px;background:var(--fill2);overflow:hidden;max-width:150px}
.mtr i{display:block;height:100%;background:var(--l1);border-radius:3px}
.tyre{--tc:#999;width:22px;height:22px;border-radius:50%;border:3px solid var(--tc);display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;flex:none;background:var(--card)}
.tyre.sm{width:19px;height:19px;border-width:2.5px;font-size:9.5px}

.stp b{font-weight:600;font-size:15px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{border:0;background:none;color:var(--l2);display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:10px;font-weight:500}
.tabbar button.on{color:var(--tint)}
.start{max-width:600px;margin:0 auto;padding:18px 0 40px}
.lt.big{font-size:44px}
.lead{margin:8px 20px 6px;font-size:17px;color:var(--l2)}
.ver{margin-top:30px;text-align:center}
.ovl{position:fixed;inset:0;z-index:30;display:none}
.ovl.show{display:block}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.38);animation:fade .2s}
.sheet2{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:0 0 calc(26px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.85,.25,1)}

.grab{width:36px;height:5px;border-radius:3px;background:var(--l3);margin:7px auto 3px}

.as .grp{margin:0;border-radius:14px}.as .grp+.grp{margin-top:8px}
.as .hd .t{align-items:center;text-align:center}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.rbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.rbar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:7px;padding:7px 14px}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.rt b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rlap{text-align:right;margin-right:4px;line-height:1}
.rlap b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;display:block}
.rlap small{font-size:11px;color:var(--l2)}
.rmain{max-width:600px;margin:0 auto;padding:12px 0 20px}
.stats{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;margin:0 16px 10px}

.stats small{display:block;font-size:11px;color:var(--l2)}
.stats b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#map{max-height:19vh;margin:0 auto}
.mapc{padding:8px}

.lights i.on{background:#FF3B30;box-shadow:0 0 12px #FF3B30}
.evt{margin:8px 26px 0;font-size:13px;color:var(--l2);min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw{margin-top:8px}

.trh{font-size:11px;color:var(--l2);height:28px}
.tr{height:33px;font-size:15px;position:relative;font-variant-numeric:tabular-nums}

.tr .p{font-weight:600;text-align:right;color:var(--l2)}
.tr .cd{font-weight:600;white-space:nowrap}
.tr .cd small{font-weight:500;color:var(--l2);font-size:11px;margin-left:5px}
.r{text-align:right}
.tr .r{font-size:14px}
.ty2{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--l2)}

.tr.out{opacity:.4}

.dc{padding:6px 0 9px}

.dc.off,.dmate.off{opacity:.45}
.dtop{display:flex;align-items:center;gap:7px;white-space:nowrap;min-width:0}
.dpos{font-size:22px;font-weight:700;letter-spacing:-.03em;min-width:38px;font-variant-numeric:tabular-nums}
.dpos.sm{font-size:17px;min-width:32px}
.dcd{font-size:17px;font-weight:600}
.dmeta{font-size:13px;color:var(--l2);font-variant-numeric:tabular-nums}
.dmeta.bat{color:var(--purple)}
.dgap{margin-left:auto;font-size:13px;color:var(--l2);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:pre}
.drow2{display:flex;gap:8px;margin-top:8px}
.drow2 .seg{flex:1}
.drow2 .seg button{padding:9px 4px;font-size:14px}
.boxb{border:0;border-radius:10px;background:var(--fill);color:var(--l1);font-weight:700;font-size:14px;padding:0 12px;min-width:74px}
.boxb.on{background:var(--yellow);color:#000}
.xtra{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.xb{border:0;border-radius:10px;background:var(--fill);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.xb small{font-size:10.5px;color:var(--l2)}.xb b{font-size:13px;font-weight:600;white-space:nowrap}
.xb.hot{background:color-mix(in srgb,var(--tint) 18%,transparent)}.xb.hot b{color:var(--tint)}
.xb.cool{background:color-mix(in srgb,var(--blue) 16%,transparent)}.xb.cool b{color:var(--blue)}
.xb.ok{background:color-mix(in srgb,var(--green) 18%,transparent)}.xb.ok b{color:var(--green)}
button.grab{display:block;border:0;padding:0;width:44px;height:5px;margin:7px auto 3px;box-shadow:0 0 0 10px transparent}.dock.min .xtra{display:none}
.mini.wide{width:100%;margin-top:9px;padding:9px;border-radius:10px;font-size:14px}
.dmate{display:flex;align-items:center;gap:7px;padding:9px 0 3px;white-space:nowrap}
.dmate .pill{margin-left:4px}
.sw{width:51px;height:31px;border-radius:16px;border:0;background:var(--fill2);position:relative;padding:0;transition:background .2s;flex:none}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .22s cubic-bezier(.3,.7,.3,1)}
.sw.on{background:var(--green)}.sw.on i{transform:translateX(20px)}
.toast{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:20;max-width:560px;margin:0 auto;animation:down .32s cubic-bezier(.2,.85,.25,1)}
.tin{display:flex;align-items:center;gap:10px;background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);border-radius:18px;padding:11px 12px;box-shadow:0 10px 34px rgba(0,0,0,.22),0 0 0 .5px var(--sep)}
.tt{flex:1;min-width:0;font-size:14px;line-height:1.3}.tt small{display:block;font-size:12px;color:var(--l2);font-weight:600}
.tin>.ic{color:var(--tint)}
@keyframes down{from{transform:translateY(-130%);opacity:0}}
.rail{position:fixed;left:0;top:64px;bottom:0;width:60px;z-index:9;display:flex;flex-direction:column;gap:6px;padding:12px 6px;overflow:auto}
.rail button{border:0;background:none;color:var(--l2);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border-radius:14px;font-size:10px;font-weight:600}
.rail button.on{background:var(--card);color:var(--tint);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.rmain{padding-left:60px!important;padding-right:0}
.rmain .grp,.rmain .stats{margin-left:4px;margin-right:12px}
.rmain .sh,.rmain .foot{margin-left:18px;margin-right:18px}
.rmain.v-map .ontower,.rmain.v-map .onmap{display:block}
.rmain .onmap,.rmain .onradio,.rmain .onplan,.rmain .ontower,.rmain .stats{display:none}
.rmain.v-map .stats{display:grid}
.rmain.v-tower .ontower,.rmain.v-radio .onradio,.rmain.v-plan .onplan{display:block}
.stats{grid-template-columns:1fr 1.35fr 1fr;gap:6px;margin-bottom:8px}
.stats div{padding:5px 9px;border-radius:10px}
.stats small{font-size:10px}.stats b{font-size:14px}
#map{max-height:17vh}
.mapc{padding:6px}
.evt{margin:6px 18px 0 18px;font-size:12.5px}
.trh,.tr{grid-template-columns:20px 18px 1fr 50px 58px 40px;gap:6px;padding:0 10px 0 6px}
.tr{height:31px;font-size:14.5px}

.x{display:none}

.v-tower .tr{height:32px}

.dock{border-radius:16px 16px 0 0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}

.dtop{gap:6px;height:24px}
.dpos{font-size:17px;min-width:28px}
.dcd{font-size:15px}
.dtop .tyre.sm{width:18px;height:18px;border-width:2.5px;font-size:9px}

.dgap{font-size:12.5px;white-space:nowrap}
.drow2{gap:6px;margin-top:4px;align-items:stretch}

.boxb{min-width:56px;padding:0 8px;font-size:13px;border-radius:8px}

 (async()=>{while(CLOUD.pending){const p=CLOUD.pending;CLOUD.pending=null;try{await CLOUD.ref.set(p)}catch(e){break}}CLOUD.busy=false})()}

const SLK='chefe-equipe-slots';let SLOTS=null,SLOT_PREV=null;

 if(cur&&cur.my)L.unshift({id:'c'+Date.now().toString(36),l:slotLabel(cur),t:Date.now(),json:JSON.stringify(cur)});slotsPut(L);
 const t=Date.now();try{localStorage.setItem(KEY,tgt.json);localStorage.setItem(KEY+'-t',t)}catch(e){CLOUD.mem=tgt.json}cloudSave(tgt.json,t);ACT.continue()};

function mkDriver(name,nat,age,o,wet,team,end){
 const g=seeded(hash(name));const j=()=>Math.round((g()-.5)*6);
 const d={id:'d'+hash(name+rnd()).toString(36),num:NUMS[name]||ri(26,99),mood:0,name,nat,age,pace:o,craft:clamp(o+j(),40,99),cons:clamp(o+j(),40,99),wet:clamp(o+wet*2+j(),40,99),team,end,salary:0};
 d.pot=clamp(o+Math.max(0,24-age)*1.3+Math.round(g()*3),o,99);
 return d;
}
function salaryDemand(d,cat){const o=ovr(d);if(cat==='F1')return +clamp((o-68)*(o-68)*0.07,0.4,60).toFixed(2);return +clamp(0.05+(o-65)*0.02,0.05,0.5).toFixed(2)}
function carScore(car,tr){const wM=0.2+tr.pw*0.3,wA=(0.45-tr.pw*0.25)*((typeof S!=='undefined'&&S&&S.regs&&S.regs.aeroW)||1),wC=1-wM-wA;return car.aero*wA+car.motor*wM+car.chassi*wC}
function perfOf(t,d,tr,w){return (carScore(t.car,tr)+profB(t,tr)+p20car(t))*0.62+(d.pace*(1-w)+d.wet*w)*0.38+mood(d)*0.14+p20drv(d)}
function startCash(t){return scaleOf(t.cat)*(15+t.prestige*0.4)}

function commentary(c,res,i,pos,dnf,gain,pen){
 const n=lastName(c.d),L=c.outLap||0,o=c.out||'',tr0=R.tr;
 const sub=(t,x)=>t.replace(/\{n\}/g,n).replace(/\{p\}/g,pos).replace(/\{g\}/g,Math.abs(gain)).replace(/\{l\}/g,L).replace(/\{gr\}/g,c.grid).replace(/\{o\}/g,o).replace(/\{s\}/g,(x&&x.s)||pen).replace(/\{d\}/g,(x&&x.d)||'').replace(/\{m\}/g,(x&&x.m)||'');
 const pk=(k,x)=>sub(pickV('cm_'+k,CMP[k]),x);
 let msg;
 if(dnf){if(/batida na largada/.test(o)||L<=1)msg=pk('lap1');else msg=/batida/.test(o)?pk('crash'):pk('mech')}
 else if(pos===1)msg=(c.led||0)>=R.laps*0.7?pk('winDom'):pk('winFight');
 else if(pos<=3)msg=pk('pod');
 else if(gain>=4)msg=pk('gain');
 else if(gain<=-4)msg=pk('loss');
 else if(pos<=6)msg=pk('top6');
 else if(pos<=10)msg=pk('pts');
 else msg=gain===0?pk('same'):pk('nopts');
 if(!dnf){
  const ex=[];
  if(R.rain&&R.rain.int>0.3)ex.push('rain');if(R.scN>0)ex.push('sc');if(pen>0)ex.push('pen');if(R.fl&&R.fl.c===c)ex.push('fl');
  if(ex.length&&rnd()<0.7)msg+=' '+pk(pick(ex));
 }
 /* engenheiro de corrida */
 const avg=c.lapN?c.lapSum/c.lapN:null,bt=c.best,pc=c.pits||[],cand=[];
 if(dnf){cand.push('Vamos analisar os dados na fábrica para entender o que aconteceu.','A telemetria vai ser revisada com calma antes da próxima corrida.');if(!/batida/.test(o))cand.push('Foi uma falha pontual. Já pedimos reforço na inspeção do conjunto.')}
 else{
  if(avg&&bt&&avg-bt<1.3)cand.push(`Ritmo muito regular: a média ficou a ${(avg-bt).toFixed(1)}s da melhor volta.`);
  if(avg&&bt&&avg-bt>=2.2)cand.push(`Ritmo irregular, ${(avg-bt).toFixed(1)}s entre a média e a melhor volta. Tem pneu ou tráfego nessa conta.`);
  if(c.stops>=2)cand.push(`Foram ${c.stops} paradas. O desgaste pediu trocas extras e a estratégia dependeu disso.`,'Com três stints, o último conjunto foi o que mais rendeu.');
  if(c.stops===1)cand.push('Parada única executada no tempo planejado.','Com uma parada só, o segredo foi cuidar do pneu no primeiro stint.');
  if(c.stops===0)cand.push('Sem paradas: o pneu aguentou do início ao fim.','Corrida num só conjunto, o pneu foi o limite nas voltas finais.');
  if(pc.some(p=>p.t>=4.5))cand.push('Parada lenta, mais de 4 segundos parado, custou posições.');
  if(pc.length&&pc.every(p=>p.t<3))cand.push('Box limpo e rápido, a equipe de pit mandou bem.');
  if((c.ev||[]).some(e=>/asa/i.test(e.m)))cand.push('O dano na asa dianteira custou ritmo até a troca.');
  if(R.scN>0)cand.push('O safety car mexeu com a estratégia: quem estava com pneus novos ganhou.');
  if(R.rain&&R.rain.int>0.3)cand.push('A chuva pediu atenção total à temperatura dos pneus.');
  cand.push(`Largamos de ${TYN(c.startTy)} e isso moldou o primeiro stint.`);
  if(c.bat<20)cand.push('A bateria chegou quase vazia nas voltas finais.');
 }
 const eng=pickV('eng',cand);
 /* analista: comparação com o companheiro */
 const m=res.find(r=>r.t===c.t&&r.c!==c);let ana='';
 if(m){const mp=res.indexOf(m)+1,md=!!m.dnf,mn=lastName(m.d),x={m:mn};
  const pool=[];
  if(!dnf&&!md){const d=mp-pos;x.d=Math.abs(d);
   if(d>=5)pool.push('{n} deu show: {d} posições à frente de {m}.','Uma aula de {n} sobre {m} dentro da garagem.');
   else if(d>0)pool.push('{n} levou a melhor sobre {m} dentro da equipe.','Duelo interno: {n} saiu na frente de {m}.');
   else if(d<=-5)pool.push('{m} foi muito melhor hoje, {d} posições à frente de {n}.');
   else if(d<0)pool.push('{m} foi mais rápido que {n} desta vez.','Dentro da equipe, {m} levou a melhor.');
   else pool.push('Equilíbrio total entre os dois carros da equipe.');
   if(pos<=10&&mp<=10)pool.push('Os dois carros pontuaram, ótimo para os construtores.');
   if(pos>10&&mp>10)pool.push('Os dois carros ficaram fora dos pontos, o que dói nos construtores.')}
  else if(dnf&&!md)pool.push('Sem {n} na pista, o resultado da equipe dependeu só de {m}.','O abandono de {n} deixou {m} sozinho na briga.');
  else if(!dnf&&md)pool.push('Com o abandono de {m}, {n} carregou a equipe sozinho.','{n} segurou as pontas depois do abandono de {m}.');
  else pool.push('Dois carros fora da prova: um dos piores fins de semana possíveis para a equipe.');
  ana=sub(pickV('ana',pool),x);
 }
 return {msg,eng,ana};
}

function accepts(d,sal,yrs,renew,bonus){

}

const TESTS={F1:[{k:'esp',n:'Barcelona',s:'Fim de janeiro, shakedown a portões fechados',priv:true},{k:'bhr',n:'Bahrein 1',s:'Fevereiro, primeiro teste oficial'},{k:'bhr',n:'Bahrein 2',s:'Fevereiro, último teste antes da abertura'}],F2:[{k:'bhr',n:'Bahrein',s:'Teste oficial de pré-temporada'}]};

function testsOk(){const c=myCat();return S.tests&&S.tests.y===S.year&&S.tests.c===c}
function testsMake(){const c=myCat(),teams=S.teams.filter(t=>t.cat===c);
 const hide={},learn={};teams.forEach(t=>{hide[t.id]=rr(0.1,0.45)+(t.prestige>=80?rr(0.25,0.9):rr(0,0.35));learn[t.id]=rr(-0.3,0.05)});
 const ses=TESTS[c].map((ss,si)=>{const tr=TRACKS[ss.k],base=tr.t*(c==='F2'?1.07:1),rows=[];
  teams.forEach(t=>{const ds=teamDrivers(t.id);if(!ds.length)return;
   const iss=rnd()<clamp(0.34-(t.car.conf-55)*0.006,0.04,0.34)*(si===0?1.4:1)?pick(ISSUES):null,who=iss?ri(0,ds.length-1):-1;
   ds.forEach((d,j)=>{const real=base*(1+(100-perfOf(t,d,tr,0))*0.0011)+learn[t.id]*si;
    const ty=rnd()<0.3+si*0.2?'S':(rnd()<0.6?'M':'H');
    const best=real+TY[ty].off+hide[t.id]*(si===TESTS[c].length-1?0.6:1)*rr(0.7,1.2)+Math.abs(gauss())*0.12*(1.45-d.cons/100);
    const lr=real+1.1+hide[t.id]*0.15+gauss()*0.06;
    let laps=c==='F1'?ri(150,230):ri(70,110);if(j===who)laps=Math.round(laps*rr(0.35,0.7));
    rows.push({did:d.id,n:d.name,tid:t.id,tn:t.name,best:+best.toFixed(3),ty,lr:+lr.toFixed(3),laps,iss:j===who?iss:null})})});
  rows.sort((a,b)=>a.best-b.best);return {n:ss.n,s:ss.s,priv:!!ss.priv,rows}});
 S.tests={y:S.year,c,ses,seen:false};const top=ses[ses.length-1].rows[0];
 if(top)news(`${top.n} (${top.tn}) termina a pré-temporada com o melhor tempo.`);save()}
function testsTeams(){const ses=S.tests.ses,last=ses.length-1,L={};
 ses.forEach((s,si)=>{const m=Math.min(...s.rows.map(r=>r.lr));s.rows.forEach(r=>{const x=L[r.tid]=L[r.tid]||{id:r.tid,n:r.tn,best:1e9,g:[],lrl:1e9,laps:0,iss:0};
  if(si===last){x.best=Math.min(x.best,r.best);x.lrl=Math.min(x.lrl,r.lr)}x.g.push(r.lr-m);x.laps+=r.laps;if(r.iss)x.iss++})});
 const a=Object.values(L).map(x=>Object.assign(x,{lra:x.g.reduce((p,v)=>p+v,0)/x.g.length}));
 a.sort((p,q)=>p.best-q.best).forEach((x,i)=>x.bp=i+1);a.sort((p,q)=>p.lra-q.lra).forEach((x,i)=>x.rp=i+1);return a}

 else{const s=X.ses[+cur],b=s.rows[0].best;

 const opts=[['g','Termômetro']].concat(X.ses.map((s,i)=>[String(i),s.n]));

function wetPen(ty,w){
 if('SMH'.includes(ty))return w*16;
 if(ty==='I')return w<0.3?1.2+(0.3-w)*12:(w>0.65?1.2+(w-0.65)*14:1.2);

}

 let t=R.base*(1+(100-perfOf(c.t,d,R.tr,w))*0.0011);
 t+=TY[c.tyre].off;
 t+=(wetPen(c.tyre,w)+w*5)*(1.25-d.wet/200);
 t+=c.wear*0.018+Math.max(0,c.wear-75)*0.09;
 t+=MODES[c.mode].off+ENG[c.eng||'std'].off+(c.defend?0.08:0);
 if(c.boost)t-=0.55;
 if(c.bat<12)t+=0.5;
 t+=(R.laps-Math.max(0,c.prog))/R.laps*1.2;
 t+=(c.form||0)+aeroOff(c)+(c.d.trait==='chuva'?-0.3*R.wet:0);
 if(c.cold)t+=({S:0.55,M:0.95,H:1.45,I:0.7,W:0.6})[c.tyre]||0.9;
 if(!c.cold&&c.tyLaps===1&&!c.usedSet)t-=0.28;
 if(c.usedSet)t+=0.18;
 if(c.dmg)t+=0.7;
 if(c.pwr)t+=0.55;
 if(c.lapPen)t+=c.lapPen;
 if(R.laps-Math.floor(Math.max(0,c.prog))<=3&&c.gapA!=null&&c.gapA<1.6)t-=0.22;
 t+=gauss()*0.22*(1.45-d.cons/100)*(c.mine&&S.staff?1-(stq('re')-3)*0.08:1);
 if(c.mine&&S.fac)t-=(S.fac.sim-2)*0.05;
 if(c.prog<1)t+=Math.abs(gauss())*0.7;

}

 try{const bb=pth.getBBox();svg.setAttribute('viewBox',`${(bb.x-14).toFixed(1)} ${(bb.y-14).toFixed(1)} ${(bb.width+28).toFixed(1)} ${(bb.height+28).toFixed(1)}`);
  const L=pth.getTotalLength(),pt=pth.getPointAtLength(L*0.05),t1=svg.querySelector('.bm-t1');if(t1){t1.setAttribute('transform',`translate(${pt.x.toFixed(1)},${pt.y.toFixed(1)})`)}}catch(e){}})}
function countUp(root){root.querySelectorAll('[data-cu]').forEach(el=>{const to=+el.dataset.cu;if(!isFinite(to)||to===0)return;const dec=+(el.dataset.dec||0),suf=el.dataset.suf||'',t0=performance.now(),dur=650;
 const f=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=(to*e).toFixed(dec)+suf;if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function bigMap(id){const p=trackPath(id);const ang=Math.atan2(p.s2[1]-p.s[1],p.s2[0]-p.s[0])+Math.PI/2,lx=Math.cos(ang)*7,ly=Math.sin(ang)*7;
 return `<svg class="bigmap" viewBox="0 0 300 200" role="img" aria-label="Traçado do circuito">
 <path class="bm-base" d="${p.d}" fill="none" stroke="var(--asph)" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
 ${['#FF3B4E','#3DA0FF','#FFD12E'].map((c,i)=>`<path d="${p.d}" pathLength="3" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="butt" stroke-dasharray="1 2" stroke-dashoffset="${-i}"/>`).join('')}
 <line x1="${(p.s[0]-lx).toFixed(1)}" y1="${(p.s[1]-ly).toFixed(1)}" x2="${(p.s[0]+lx).toFixed(1)}" y2="${(p.s[1]+ly).toFixed(1)}" stroke="#fff" stroke-width="3.5"/>
 <g class="bm-t1"><circle r="7.5" fill="var(--bg)" stroke="var(--l2)" stroke-width="1.2"/><text y="3" text-anchor="middle" font-size="7.5" font-weight="800" fill="var(--l1)">T1</text></g></svg>

function radarSVG(d,col){const ax=[['Ritmo',d.pace],['Corrida',d.craft],['Chuva',d.wet],['Constância',d.cons],['Potencial',d.pot||d.pace]],n=ax.length,R0=44,cx=80,cy=62;
 const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R0*Math.max(0,(v-40))/59;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
 const ring=f=>ax.map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return (cx+Math.cos(a)*R0*f).toFixed(1)+','+(cy+Math.sin(a)*R0*f).toFixed(1)}).join(' ');
 return `<svg class="radar" viewBox="0 0 160 128" aria-hidden="true">${[1,.66,.33].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="var(--sep)" stroke-width="1"/>`).join('')}
 <polygon points="${ax.map((x,i)=>pt(i,x[1]).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="${col}" fill-opacity=".28" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
 ${ax.map((x,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,lx=cx+Math.cos(a)*(R0+12),ly=cy+Math.sin(a)*(R0+10)+3;return `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="8" fill="var(--l2)">${x[0]}</text>`}).join('')}</svg>`}

function genPlans(L,k,pl,wet,st,SP){

 if(wet>0.2&&!st){const a=wet>0.72?'W':'I',b=a==='W'?'I':'W';return [{tys:[a],stops:[],wet:true,cost:0},{tys:[b],stops:[],wet:true,cost:4}]}
 if(SP){const opts=st?[st]:['S','M','H'];return opts.map(t=>({tys:[t],stops:[],cost:stintCost(t,L,k),sprint:true})).sort((a,b)=>a.cost-b.cost)}
 let combos=[['M','H'],['S','H'],['H','M'],['H','S'],['S','M'],['M','S'],['S','M','S'],['M','H','S'],['S','H','S'],['M','M','H'],['S','S','M'],['H','M','S'],['H','S','M'],['H','H','S'],['M','H','M'],['H','M','M']];
 if(st)combos=combos.filter(c=>c[0]===st);
 const out=[];
 combos.forEach(tys=>{
  const lives=tys.map(t=>72/(TY[t].wear*k)),sum=lives.reduce((a,b)=>a+b,0);
  if(sum*(st?1.3:1.15)<L)return;
  const n=lives.map(l=>Math.max(2,Math.round(L*l/sum)));n[n.length-1]+=L-n.reduce((a,b)=>a+b,0);
  if(n[n.length-1]<2||n.some((x,i)=>x>lives[i]*(st?1.5:1.3)))return;
  let cost=(tys.length-1)*pl;n.forEach((x,i)=>cost+=stintCost(tys[i],x,k));
  const stops=[];let acc=0;for(let i=0;i<n.length-1;i++){acc+=n[i];stops.push(acc)}
  out.push({tys,stops,cost});
 });
 out.sort((a,b)=>a.cost-b.cost);
 if(!out.length&&st){const o=st==='H'?'M':'H';out.push({tys:[st,o],stops:[Math.round(L/2)],cost:0})}
 return out.length?out.slice(0,4):[{tys:['M','H'],stops:[Math.round(L/2)],cost:0}];
}

}

 if(pl[0].wet){return {i:0,why:'Pista molhada: comece com '+TY[pl[0].tys[0]].n+' e troque conforme o clima.'}}
 if(SP){why.push(TY[pl[0].tys[0]].n+' é o composto mais rápido que aguenta a Sprint inteira, sem parada');if(g>=10&&p.startTy!=='S')why.push('largando atrás, o macio ajuda a ganhar posições');return {i:0,why:why.map(cp).join('. ')+'.'}}
 const slack=(tr.ov>=0.7||tr.pit>=24)?3.5:1.0;
 const fewer=pl.map((x,k)=>k).filter(k=>n(pl[k])<n(pl[0])&&pl[k].cost-pl[0].cost<=slack);
 if(fewer.length){i=fewer[0];why.push(tr.pit>=24?'o box custa cerca de '+tr.pit+'s aqui, então menos paradas compensa':tr.ov>=0.7?'ultrapassar é difícil nesta pista, menos paradas protege a posição':'uma parada a menos custa menos de um segundo no total')}
 else why.push('menor tempo total estimado, com '+n(pl[0])+' '+(n(pl[0])>1?'paradas':'parada'));
 if(g>=12)why.push('largando atrás, vale ser agressivo no primeiro stint');else if(g>0&&g<=3)why.push('na frente do grid, o foco é proteger a posição');

function dotdPick(fin,out){
 const all=[...fin,...out],L=[];
 all.forEach(c=>{const pos=all.indexOf(c)+1,dnf=!!c.out,why=[];let sc=0;
  const gain=c.grid-pos;
  if(!dnf&&gain>0){sc+=gain*2.6;if(gain>=3)why.push(`+${gain} posições`)}
  const ov=c.ovt||0;sc+=ov*1.7;if(ov>=3)why.push(`${ov} ultrapassagens`);
  if(!dnf){sc+=pos===1?11:pos===2?7:pos===3?5:pos<=10?2:0;if(pos<=3)why.push(pos===1?'Venceu':`Pódio, ${pos}º`)}
  if(!dnf&&c.dmg){sc+=6;why.push('Recuperou de dano no carro')}
  if(!dnf&&(c.pen||0)>0&&pos<=10){sc+=3.5;why.push(`Superou ${c.pen}s de punição`)}
  if(!dnf&&c.grid>=14&&pos<=8){sc+=6;why.push(`Saiu de ${c.grid}º`)}
  const led=c.led||0;if(led>0){sc+=Math.min(6,led/Math.max(1,R.laps)*9);if(led>=R.laps*0.5)why.push(`${led} voltas na frente`)}
  if(!dnf&&(c.lost||0)<=1&&pos<=6&&ov>=1){sc+=2;why.push('Defesa sólida')}
  if(R.fl&&R.fl.c===c){sc+=3;why.push('Volta mais rápida')}
  const pr=c.t.prestige||70;if(!dnf&&pos<=10&&pr<75){const u=Math.min(7,(75-pr)/3.5);sc+=u;if(u>3)why.push('Carro de equipe menor')}
  if(R.wet>0.35&&!dnf&&gain>0){sc+=3;why.push('Brilhou na chuva')}
  if(c.d.farewell===S.year){sc+=4;if(S.round[R.cat]>=cal(R.cat).length-1){sc+=8;why.unshift('Corrida de despedida')}}
  if(dnf)sc*=0.35;
  sc+=Math.random()*3.2+((c.d.craft||72)-72)*0.05+(S.soc&&S.soc.camp&&S.soc.camp.id===c.d.id?4.5:0)+Math.min(2.5,Math.log10(1+socF(c.d))*1.2);
  L.push({c,sc:Math.max(0.2,sc),why:why.slice(0,3),pos,dnf})});
 L.sort((a,b)=>b.sc-a.sc);
 const top=L.slice(0,5),w=top.map(x=>Math.pow(x.sc,1.5)),tot=w.reduce((a,b)=>a+b,0)*1.08;
 top.forEach((x,i)=>x.pct=Math.max(2,Math.round(w[i]/tot*100)));
 R.dotd=top;const win=top[0];if(!win)return;
 if(R.auto)return;
 if(!win.why.length)win.why.push('Corrida consistente');
 addLog(`Piloto do Dia: ${win.c.d.name} (${win.pct}% dos votos)`,win.c.mine,'lead');
}

 new IntersectionObserver(es=>{const e=es[es.length-1];let hid=e.isIntersecting?Math.round(e.boundingClientRect.height-e.intersectionRect.height):H;hid=Math.max(0,Math.min(H,hid));
  const vis=e.isIntersecting?e.intersectionRect:null;if(vis&&e.intersectionRect.top>e.boundingClientRect.top+1)hid=0;

function loop(ts){

 if(!R.paused&&!R.over){
  if(R.countdown>0){R.countdown-=dt;if(R.countdown<=0){R.countdown=0;lightsOut()}}
  else{const spd=R.skip?(momentNow()?1:10):R.speed;R.effSp=spd;let sim=dt*R.rate*spd*(R.red?2:R.sc?1.5:R.vsc?1.6:1);while(sim>0&&!R.over){const s=Math.min(sim,R.base*0.03);step(s);sim-=s}
   R.whT-=dt;if(R.whT<=0){R.whT=rr(1.2,3.2)/Math.min(4,R.effSp||R.speed);if(!R.sc)SND.whoosh()}}
 }
 SND.engineUpdate();if(rview==='map')drawDots();R.uiT+=dt;if(R.uiT>0.25){R.uiT=0;raceUI()}
 if(!R.over||R.uiT===0)raf=requestAnimationFrame(loop);
}

 if(c.out)return 'Fora';if(c===lead)return R.flag?'Venceu':'Líder';
 if(c.done&&lead.done){const ld=lapsDone(lead)-lapsDone(c);return ld>=1?'+'+ld+'V':'+'+(c.finishT-lead.finishT).toFixed(1)}

function reportOf(c,res){
 const i=res.findIndex(r=>r.c===c),pos=i+1,dnf=!!c.out,gain=dnf?0:c.grid-pos;
 const avg=c.lapN?c.lapSum/c.lapN:null,pen=c.pen||0;
 let nota=6+gain*0.3+((res[i].pts||0)>0?0.8:0)+(pos===1&&!dnf?1.5:0)-(dnf&&/batida/.test(c.out)?3:dnf?0.5:0)-(pen>=20?1:pen>0?0.3:0)+(c.ovt||0)*0.1-(c.lost||0)*0.03;

 const st=[];let last=c.startTy,from=0;(c.pits||[]).forEach(p=>{st.push({ty:last,n:p.lap-from});last=p.to;from=p.lap});st.push({ty:last,n:Math.max(1,Math.min(R.laps,Math.floor(c.prog))-from)});
 const cx=commentary(c,res,i,pos,dnf,gain,pen);const msg=cx.msg;

 ev2.sort((a,b)=>a.l-b.l);const evAll=ev2.slice();
 if(!dnf)ev2.push({l:R.laps,m:`Bandeirada em ${pos}º${pen?`, com ${pen}s de punição somados`:''}`});
 const hl=[];
 if(hist.length>2){const mn=Math.min(...hist),mx=Math.max(...hist);if(mx-mn>=2){hl.push(`Melhor momento: P${mn} na volta ${hist.indexOf(mn)+1}`);hl.push(`Pior momento: P${mx} na volta ${hist.indexOf(mx)+1}`)}
  const t3=hist.filter(x=>x<=3).length,t10=hist.filter(x=>x<=10).length;if(t3)hl.push(`${t3} ${t3>1?'voltas':'volta'} no top 3`);else if(t10)hl.push(`${t10} ${t10>1?'voltas':'volta'} no top 10`)}
 const pitsA=(c.pits||[]).map(p=>({lap:p.lap,t:p.t,from:p.from,to:p.to})),scL=(R.log||[]).filter(l=>l.k==='sc'||l.k==='vsc').map(l=>({l:l.l,k:l.k}));
 return {col:c.t.color,cd:code(c.d),pitsA,scL,laps:R.laps,name:c.d.name,num:c.d.num,did:c.d.id,pos,dnf,out:c.out,grid:c.grid,gain,best:c.best||null,avg,led:c.led||0,ovt:c.ovt||0,lost:c.lost||0,stops:c.stops,pitT:(c.pits||[]).reduce((a,p)=>a+p.t,0),pts:res[i].pts||0,nota,st,hist,msg,eng:cx.eng,ana:cx.ana,ev:ev2.slice(0,20),evAll,hl,pen};
}

/* ---------- túnel de vento por posição (ATR) ---------- */
function atrPosOf(id){const t=T(id);if(!t)return 6;const c=t.cat,half=Math.floor(cal(c).length/2);
 if(!S.offseason&&S.round[c]>=half){const i=teamStand(c).findIndex(x=>x.t.id===id);if(i>=0)return i+1}
 return (S.atrPos&&S.atrPos[id])||6}
function atrHours(id){const t=T(id),n=t?S.teams.filter(x=>x.cat===t.cat).length:11,p=Math.min(n,atrPosOf(id)),sp=(S.regs&&S.regs.atr)||1;return clamp(0.925+((p-1)/Math.max(1,n-1)-0.5)*0.45*sp,0.5,1.4)}
function atrG(id){return 0.85+(atrHours(id)-0.70)*0.667}
function atrHTML(){const c=myCat(),h=atrHours(S.my),p=atrPosOf(S.my),half=Math.floor(cal(c).length/2),mid=!S.offseason&&S.round[c]>=half;
 return `<div class="sh">Túnel de vento</div><div class="grp"><div class="cell"><span class="t"><b>${Math.round(h*100)}% das horas de túnel e CFD</b><small>Pela ${p}ª posição ${mid?'atual nos construtores (revisão do meio do ano)':'no campeonato passado'}. Quem termina atrás ganha mais horas.</small></span><span class="v ${h>=1?'good':'bad'}">${h>=1?'+':''}${Math.round((atrG(S.my)-1)*100)}%</span></div></div><p class="foot">O ganho das peças acompanha as horas de túnel. A FIA revisa a escala no meio da temporada.</p>`}

function negScore(d,sal,yrs,renew,bonus){const c=myCat(),ratio=sal/salaryDemand(d,c);let s=(ratio-1)*90+(myTeam().prestige-40-(ovr(d)-65)*1.2)*0.8;if(renew)s+=18;
 else if(d.team){const dt=T(d.team);if(dt.cat==='F1'&&c==='F2')s-=80;if(dt.cat==='F2'&&c==='F1')s+=40;if(dt.cat===c)s+=(myTeam().prestige-dt.prestige)*0.6}else s+=15;

function clB(m){return (m.cpod?7:0)+(m.cmul==='alta'?-9:0)+(m.cn1?12:0)}
const clPod=(sal)=>+(sal*0.04).toFixed(3);
ACT.ocl=v=>{const [k,x]=String(v).split(':');if(!modal)return;if(k==='pod')modal.cpod=x==='1';if(k==='mul')modal.cmul=x;if(k==='n1')modal.cn1=x==='1';modal.counter=null;render()};
ACT.ocounter=()=>{const m=modal;if(!m||!m.counter)return;m.sal=m.counter.r;m.force=true;m.counter=null;ACT.send()};
function clApply(d,m){const c=myCat(),sal=+(salaryDemand(d,c)*m.sal).toFixed(3);d.cl={pod:m.cpod?clPod(sal):0,mul:m.cmul||'norm'};if(m.cn1){S.n1=d.id;S.n1Lock={y:S.year,id:d.id};teamDrivers(S.my).filter(x=>x.id!==d.id).forEach(x=>addMood(x,-1.5))}}
function negFail(m,d,renew,bonus){const c=myCat(),dem=salaryDemand(d,c),sal=dem*m.sal,s=negScore(d,sal,m.yrs,renew,(bonus||0)+clB(m));m.rd=(m.rd||0)+1;

 if(s>-38){const r=+Math.min(2.4,m.sal+(10-s)/90).toFixed(2);m.counter={r};m.msg=`O empresário de ${lastName(d)} fez uma contraproposta: ${money(dem*r)} por ano, mantendo as cláusulas. Rodada ${m.rd} de 3.`}

 ${m.counter?`<div class="grp negc"><div class="cell"><span class="t"><b>Contraproposta do empresário</b><small>${money(salaryDemand(d,myCat())*m.counter.r)} por ano, ${m.yrs} ${m.yrs>1?'anos':'ano'}</small></span><button class="mini" data-a="ocounter">Aceitar</button></div></div>`:''}`}

{const _ar=p20AfterRace;p20AfterRace=function(res,sp){_ar(res,sp);if(!sp&&R&&R.cat===myCat()){try{trecRace(res);if(R.cat==='F1')milestones(res)}catch(e){console.error(e)}}}}

/* ---------- forma recente com a pista ---------- */
function fgChip(x){const b=x.b,cl=x.dnf?'ab':b===1?'g1':b===2?'g2':b===3?'g3':b<=10?'pt':'np',t=x.dnf?'AB':'P'+b,tr=TRACKS[x.tid];return `<span class="fgw"><span class="fg ${cl}">${t}</span><small>${tr?tr.f:''}</small></span>`}
{const _gp=gpPanel;gpPanel=function(){let h=_gp();if(!h)return h;const c=myCat(),tid=cal(c)[S.offseason?0:S.round[c]];h=h.replace('<small>Últimas corridas</small>','<small>Sua forma</small>');const r=trecHTML(tid);return r?h.replace(/<\/div>$/,r+'</div>'):h}}

/* ---------- pós-corrida enxuto ---------- */
function reportHTML(r){const N=R?R.cars.length:22,mom=repMoments(r),du=repDuels(r);
 const stint=r.st.map(s=>`<i style="flex:${Math.max(1,s.n)};--tc:${TY[s.ty].c}"><span>${s.ty} ${s.n}v</span></i>`).join('');
 return `<div class="cover rcov" style="--tc:${r.col||'var(--tint)'}"><div class="cvt"><small>${esc(r.name)}</small><span>Largou ${r.grid}º, ${r.dnf?'abandonou':'terminou '+r.pos+'º'}, ${r.pts} pts</span></div>
 <div class="cvh"><span class="rnota ${r.nota>=7.5?'hi':r.nota<5?'lo':''}">${r.nota.toFixed(1)}</span><div><h2>${esc(repHead(r))}</h2><p>${esc(r.msg)}</p></div></div>
 ${repChart(r,N)}
 <details class="rall"><summary>Detalhes da corrida de ${esc(r.name.split(' ').slice(-1)[0])}</summary>
 <div class="rmom">${mom.map(m=>`<div class="${m.k}"><small>${m.t}</small><b>V${m.l}</b><span>${esc(m.m)}</span></div>`).join('')}</div>
 ${du.length?`<div class="rduel2"><small>Duelos na pista</small>${du.map(([n,[a,b]])=>`<p>Com ${esc(n)}: ${a?`passou ${a} ${a>1?'vezes':'vez'}`:'não passou'}${b?`, foi passado ${b} ${b>1?'vezes':'vez'}`:', não perdeu posição'}.</p>`).join('')}</div>`:''}
 <div class="rstr"><small>Estratégia</small><div class="stints">${stint}</div><p>${r.stops?`${r.stops} ${r.stops===1?'parada':'paradas'}: ${(r.pitsA||[]).map(p=>`V${p.lap+1} ${TY[p.to]?TY[p.to].n:p.to} (${p.t.toFixed(1)}s)`).join(', ')}`:'Sem paradas'}${r.best?`. Melhor volta ${fmtT(r.best)}`:''}${r.pen?`. Punições: ${r.pen}s`:''}</p></div>
 ${r.eng?`<div class="rradio"><small>Rádio do engenheiro</small><p>"${esc(r.eng)}"</p></div>`:''}
 <div class="tl">${(r.evAll||r.ev||[]).map(e=>`<div><b>V${e.l}</b><span>${esc(e.m)}</span></div>`).join('')}</div>${r.ana?`<p class="rana">${esc(r.ana)}</p>`:''}</details></div>`}
/* surpresa: estratégia de todos, no estilo da transmissão */

function vResults(){const s=R.summary,c=R.cat,done=S.round[c]>=cal(c).length,sp=s.sprint;
 const mine=s.rows.map((r,i)=>({r,i})).filter(x=>x.r.mine);
 const hd=s.heads&&s.heads.length?`<div class="sh">Mídia</div><div class="grp">${s.heads.map(mediaItem).join('')}</div>`:'';
 const bd=s.board?`<div class="grp">${cell('Confiança da diretoria',`<span class="${boardCls(s.board.after)}">${Math.round(s.board.after)}</span>`,`${s.board.delta>=0?'+':''}${s.board.delta.toFixed(1)} nesta corrida, ${s.board.status}`)}${s.offer?cell(`Nova proposta de trabalho da ${esc(s.offer)}`,null,'Veja na aba Equipe'):''}</div>`:'';
 const acc=sp?`<div class="grp">${s.bonus?cell('Bônus do patrocinador',`<span class="good">${money(s.bonus)}</span>`):cell('Sem bônus nesta Sprint')}</div>`
  :`<div class="grp">${cell('Patrocínio e TV',`<span class="good">${money(s.inc)}</span>`)}${s.bonus?cell('Bônus do patrocinador',`<span class="good">${money(s.bonus)}</span>`):''}${cell('Salários',`<span class="bad">${money(-s.sal)}</span>`)}${cell('Operação',`<span class="bad">${money(-s.ops)}</span>`)}${cell('<b>Caixa agora</b>',`<b>${money(S.money)}</b>`)}</div>`;
 const row=(r,i)=>`<div class="srow ${r.mine?'mine':''} ${r.gap==='Abandono'?'out':''}" style="--tc:${r.col}"><span class="p">${i+1}</span><i></i><b>${esc(r.cd)}</b><span class="nm">${esc(r.n.split(' ').slice(-1)[0])}<small>${r.grid-(i+1)>0?'▲'+(r.grid-(i+1)):r.grid-(i+1)<0?'▼'+((i+1)-r.grid):''}</small></span><span class="gp">${r.gap==='Abandono'?'AB':esc(r.gap)}</span><span class="pt">${r.pts||''}</span></div>`;
 return nb(sp?'Resultado da Sprint':'Resultado')+`<main class="pg"><h1 class="lt">${s.tr.f} ${sp?'Sprint':'GP'} ${esc(s.tr.n)}</h1>${s.replay?'<p class="foot">Corrida repetida: só os seus pontos entram.</p>':''}
 ${coverHTML(s)}
 <div class="cards2">${flCard()}${sp?'':dotdCard(true)}</div>
 ${s.acc&&s.acc.length?`<div class="sh">${s.acc.some(a=>a.k==='dead')?'Luto':s.acc.some(a=>a.k==='inj')?'Acidente grave':'Equipe'}</div><div class="grp">${s.acc.map(a=>cell(esc(a.t))).join('')}</div>`:''}
 ${s.board&&s.board.warn?`<p class="foot bad">${esc(s.board.warn)}</p>`:''}
 ${s.reports.map(reportHTML).join('')}
 <div class="sh">Classificação</div><div class="stw">${s.rows.slice(0,10).map(row).join('')}${s.rows.length>10?`<details class="stmore"><summary>Do 11º ao ${s.rows.length}º</summary>${s.rows.slice(10).map((r,i)=>row(r,i+10)).join('')}</details>`:''}</div>
 ${gridFinish(s)}
 <details class="more"><summary>Mais da corrida ${ic('chev',14)}</summary>${R&&R.rec&&R.rec.length>8?'<button class="btn plain rpbtn" data-a="replay">Ver os melhores momentos</button>':''}${bd?'<div class="sh">Diretoria</div>'+bd:''}${hd}<div class="sh">Contas do ${sp?'sprint':'fim de semana'}</div>${acc}${s.arrived.length?`<div class="sh">Fábrica</div><div class="grp">${s.arrived.map(x=>cell(esc(x))).join('')}</div>`:''}${s.log.length?`<div class="sh">Momentos da equipe</div><div class="grp">${s.log.map(l=>cell(esc(l.m),'V'+l.l)).join('')}</div>`:''}</details>
 <button class="btn" data-a="afterrace">${sp?'Seguir para a classificação do GP':done?'Encerrar a temporada':S.fired?'Ver a decisão da diretoria':'Continuar'}</button></main>`}

/* ---------- tabela no estilo da torre ---------- */
function tTable(){const c=sub.tc||myCat();let body='';
 if(sub.tb==='c')body=calGrid(c);else if(sub.tb==='k')body=ctrMap(c);
 else if(sub.tb==='t'){const L=teamStand(c),p0=L[0]?L[0].p:0,pv=(S.prevSt&&S.prevSt[c]&&S.prevSt[c].t)||{};
  body=standChart(c,true)+`<div class="stw"><div class="sth"><span>P</span><span></span><span>EQUIPE</span><span></span><span>DIF.</span><span>PTS</span></div>${L.map((x,i)=>{const mv=pv[x.t.id]?pv[x.t.id]-(i+1):0;return `<div class="srow ${x.t.id===S.my?'mine':''}" style="--tc:${x.t.color}"><span class="p ${i===0?'ld':''}">${i+1}</span><i></i><b class="tn">${esc(x.t.name)}<small>${teamDrivers(x.t.id).map(d=>esc(code(d))).join(' ')}${mv?` <em class="${mv>0?'up':'dn'}">${mv>0?'▲':'▼'}${Math.abs(mv)}</em>`:''}</small></b><span class="gp">${i?'-'+(p0-x.p):''}</span><span class="pt" data-cu="${x.p}">${x.p}</span></div>`}).join('')}</div>`}
 else{const L=driverStand(c),p0=L[0]?L[0].s.p:0,pv=(S.prevSt&&S.prevSt[c]&&S.prevSt[c].d)||{};
  body=standChart(c,false)+`<div class="stw"><div class="sth"><span>P</span><span></span><span>PILOTO</span><span></span><span>DIF.</span><span>PTS</span></div>${L.map((x,i)=>{const t=x.d.team?T(x.d.team):null,mv=pv[x.d.id]?pv[x.d.id]-(i+1):0;return `<button class="srow ${x.d.team===S.my?'mine':''}" data-a="pfl" data-v="${x.d.id}" style="--tc:${t?t.color:'#888'}"><span class="p ${i===0?'ld':''}">${i+1}</span><i></i><b>${esc(code(x.d))}</b><span class="nm">${esc(lastName(x.d))}<small>${t?esc(t.name):'Sem equipe'}${x.s.w?`, ${x.s.w}V`:''}${mv?` <em class="${mv>0?'up':'dn'}">${mv>0?'▲':'▼'}${Math.abs(mv)}</em>`:''}</small></span><span class="gp">${i?'-'+(p0-x.s.p):''}</span><span class="pt" data-cu="${x.s.p}">${x.s.p}</span></button>`}).join('')}</div>`}
 return `<div class="subtabs">${seg('tb',[['d','Pilotos'],['t','Equipes'],['c','Calendário'],['k','Contratos']],sub.tb,'','full0')}</div>
 <div class="tbtop"><span>Temporada ${S.year}, GP ${S.round[c]} de ${cal(c).length}</span><span class="tbsw">${sub.tb==='d'||sub.tb==='t'?seg('tbv',[['s','Simples'],['x','Detalhada']],sub.tbv==='x'?'x':'s','','tcsw'):''}${seg('tc',[['F1','F1'],['F2','F2']],c,'','tcsw')}</span></div>
 ${sub.tbv==='x'&&(sub.tb==='d'||sub.tb==='t')?standChart(c,sub.tb==='t')+standDetail(c,sub.tb):body}${sub.tb==='c'?'<p class="foot">As sprints valem pontos de 8 a 1 para os oito primeiros.</p>':''}
 ${S.history.length&&sub.tb==='d'?`<details class="more"><summary>Sua carreira ${ic('chev',14)}</summary><div class="grp">${S.history.map(h=>cell(`${h.year}: ${esc(h.team)}`,h.pos+'º',h.cat)).join('')}</div></details>`:''}`}




/* ===================== 2.2: classificação simples e detalhada ===================== */
function ssOf(){if(!S.ss||S.ss.y!==S.year)S.ss={y:S.year,dnf:{},fl:{},best:{}};return S.ss}
{const _ar=p20AfterRace;p20AfterRace=function(res,sp){_ar(res,sp);if(sp||!R)return;try{const s=ssOf();res.forEach((r,i)=>{const id=r.d.id;if(r.dnf)s.dnf[id]=(s.dnf[id]||0)+1;else s.best[id]=Math.min(s.best[id]||99,i+1)});if(R.fl&&R.fl.c)s.fl[R.fl.c.d.id]=(s.fl[R.fl.c.d.id]||0)+1}catch(e){console.error(e)}}}
function standDetail(cat,kind){const s=ssOf(),y=S.yr&&S.yr.y===S.year?S.yr:null,mine=cat===myCat(),n=S.round[cat];
 const v=(o,id)=>o&&o[id]?o[id]:0,dash=x=>x?x:'<span class="z">0</span>';
 if(kind==='t'){const L=teamStand(cat);
  return `<div class="sdt"><div class="sdh t"><span>P</span><span>Equipe</span><span>V</span><span>Pód</span><span>Pole</span><span>AB</span><span>Pts</span></div>${L.map((x,i)=>{const ds=S.drivers.filter(d=>d.team===x.t.id),pod=ds.reduce((a,d)=>a+((S.pts[cat].d[d.id]||{}).pod||0),0),pole=mine?ds.reduce((a,d)=>a+v(y&&y.poles,d.id),0):0,ab=mine?ds.reduce((a,d)=>a+v(s.dnf,d.id),0):0;
   return `<div class="sdr t ${x.t.id===S.my?'mine':''}" style="--tc:${x.t.color}"><span class="p">${i+1}</span><span class="nm"><i></i>${esc(x.t.name)}</span><span>${dash(x.w)}</span><span>${dash(pod)}</span><span>${mine?dash(pole):'-'}</span><span>${mine?dash(ab):'-'}</span><b>${x.p}</b></div>`}).join('')}</div>`}
 const L=driverStand(cat);
 return `<div class="sdt"><div class="sdh"><span>P</span><span>Piloto</span><span>V</span><span>Pód</span><span>Pole</span><span>VR</span><span>AB</span><span>Pts</span></div>${L.map((x,i)=>{const t=x.d.team?T(x.d.team):null,id=x.d.id;
  return `<button class="sdr ${x.d.team===S.my?'mine':''}" data-a="pfl" data-v="${id}" style="--tc:${t?t.color:'#888'}"><span class="p">${i+1}</span><span class="nm"><i></i><b>${esc(code(x.d))}</b><small>${mine&&s.best[id]?'melhor P'+s.best[id]:''}</small></span><span>${dash(x.s.w)}</span><span>${dash(x.s.pod)}</span><span>${mine?dash(v(y&&y.poles,id)):'-'}</span><span>${mine?dash(v(s.fl,id)):'-'}</span><span>${mine?dash(v(s.dnf,id)):'-'}</span><b>${x.s.p}</b></button>`}).join('')}</div>
 <p class="foot">V vitórias, Pód pódios, VR voltas mais rápidas, AB abandonos. ${n} ${n===1?'GP disputado':'GPs disputados'}.${mine?'':' Poles e abandonos só aparecem na categoria em que você corre.'}</p>`}
ACT.tbv=v=>{sub.tbv=v;render()};
/* janela do troféu: simples e detalhada também */
ACT.stv=v=>{ST.v=v;stRender()};

/* ===================== 2.3: largada x chegada ===================== */
function gridFinish(s){const rows=s.rows,N=rows.length;if(N<2)return '';const H=Math.max(260,N*17),W0=320,top=10,step=(H-top*2)/(N-1),y=i=>top+i*step,xL=46,xR=W0-46;
 const ord=rows.map((r,i)=>({r,fin:i+1,g:r.grid,out:r.gap==='Abandono'})),byGrid=ord.slice().sort((a,b)=>a.g-b.g);
 const lines=ord.map(o=>{const y1=y(o.g-1),y2=y(o.fin-1),c=o.r.col,w=o.r.mine?3:1.6,op=o.r.mine?1:.55;return `<path d="M${xL} ${y1.toFixed(1)} C${(W0/2).toFixed(0)} ${y1.toFixed(1)} ${(W0/2).toFixed(0)} ${y2.toFixed(1)} ${xR} ${y2.toFixed(1)}" fill="none" stroke="${c}" stroke-width="${w}" stroke-opacity="${op}" ${o.out?'stroke-dasharray="3 3"':''}/>`}).join('');
 const lab=(o,x,yy,anchor)=>`<text x="${x}" y="${(yy+3.5).toFixed(1)}" text-anchor="${anchor}" font-size="10" font-weight="${o.r.mine?700:500}" fill="${o.r.mine?'var(--l1)':'var(--l2)'}">${esc(o.r.cd)}</text>`;
 const L=byGrid.map((o,i)=>lab(o,xL-6,y(i),'end')+`<circle cx="${xL}" cy="${y(i).toFixed(1)}" r="2.6" fill="${o.r.col}"/>`).join(''),R0=ord.map((o,i)=>lab(o,xR+6,y(i),'start')+`<circle cx="${xR}" cy="${y(i).toFixed(1)}" r="2.6" fill="${o.out?'#FF5147':o.r.col}"/>`).join('');
 const fins=ord.filter(o=>!o.out),gain=fins.slice().sort((a,b)=>(b.g-b.fin)-(a.g-a.fin))[0],loss=fins.slice().sort((a,b)=>(a.g-a.fin)-(b.g-b.fin))[0];
 return `<div class="sh">Largada e chegada</div><div class="gfc"><div class="gfh"><span>Grid</span><span>Bandeirada</span></div><svg viewBox="0 0 ${W0} ${H}" class="gfs">${lines}${L}${R0}</svg>
 <div class="gfk">${gain&&gain.g-gain.fin>0?`<span class="up">${esc(gain.r.cd)} ganhou ${gain.g-gain.fin} posições</span>`:''}${loss&&loss.g-loss.fin<0?`<span class="dn">${esc(loss.r.cd)} perdeu ${loss.fin-loss.g}</span>`:''}${ord.some(o=>o.out)?'<span class="ab">Tracejado: abandonou</span>':''}</div></div>`}

window.addEventListener('resize',()=>{if(view==='race')padDock()});
window.addEventListener('orientationchange',()=>setTimeout(()=>{if(view==='race')padDock()},250));
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
